<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookZA | Customer History</title>

    <style>
        * {
    box-sizing: border-box;
}

:root {
    color-scheme: light;
}

body {
    margin: 0;
    padding: 20px;
    background: #f1f1f1;
    color: #171717;
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
}

.container {
    max-width: 850px;
    margin: 0 auto;
}

header {
    background: #111;
    color: #fff;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 22px;
}

header h1 {
    margin: 0 0 5px;
    font-size: 28px;
    color: #fff;
}

header p {
    margin: 0;
    color: #ddd;
    font-size: 15px;
}

.card {
    background: #fff;
    color: #171717;
    border: 1px solid #dedede;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    overflow-wrap: anywhere;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
}

.card h2 {
    margin-top: 0;
    color: #111;
    font-size: 22px;
    line-height: 1.35;
}

.card h3 {
    color: #111;
}

.card p {
    color: #222;
}

.muted {
    color: #595959;
    line-height: 1.6;
}

.customer-name {
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 23px;
    font-weight: 700;
    color: #111;
}

.customer-phone {
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.whatsapp-button {
    display: block;
    width: 100%;
    text-align: center;
    background: #111;
    color: #fff !important;
    padding: 14px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: 700;
    margin: 14px 0;
    line-height: 1.4;
}

.whatsapp-button:hover,
.whatsapp-button:focus {
    background: #333;
    color: #fff !important;
}

.summary {
    background: #f5f5f5;
    color: #171717;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 15px;
    margin: 16px 0;
    line-height: 2;
}

.summary strong {
    color: #111;
}

.order {
    border-top: 1px solid #dedede;
    padding: 18px 0;
}

.order:last-child {
    padding-bottom: 0;
}

.order h3 {
    margin: 0 0 12px;
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.order p {
    margin: 9px 0;
    line-height: 1.6;
    color: #333;
}

.order p strong {
    color: #111;
}

.status {
    display: inline-block;
    padding: 5px 11px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    text-transform: capitalize;
    color: #111;
    background: #f5f5f5;
}

button {
    display: block;
    width: 100%;
    padding: 14px;
    border: 1px solid #111;
    border-radius: 9px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    line-height: 1.4;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.back-button {
    background: #fff;
    color: #111;
    border: 1px solid #bbb;
    margin-bottom: 20px;
}

.back-button:hover {
    background: #eaeaea;
}

.message {
    padding: 15px;
    border-radius: 10px;
    background: #fff;
    color: #171717;
    border: 1px solid #ddd;
    line-height: 1.6;
    margin-bottom: 18px;
    overflow-wrap: anywhere;
}

.message.error {
    color: #900;
    background: #fff;
    border-color: #e0aaaa;
}

.hidden {
    display: none;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
        font-size: 14px;
    }

    header {
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 16px;
    }

    header h1 {
        font-size: 25px;
    }

    .card {
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 14px;
    }

    .customer-name {
        font-size: 21px;
    }

    .summary {
        padding: 12px;
    }

    .order {
        padding: 15px 0;
    }

    .whatsapp-button,
    button {
        padding: 13px;
    }
}
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>BookZA</h1>
        <p>Customer History</p>
    </header>

    <button
        type="button"
        class="back-button"
        onclick="goBack()"
    >
        ← Back to Owner Dashboard
    </button>

    <div class="card">
        <h2 id="businessName">Loading business...</h2>

        <p class="muted">
            View returning customers and their previous orders
            for this business.
        </p>

        <button
            id="refreshButton"
            type="button"
            onclick="loadCustomerHistory()"
        >
            Refresh Customer History
        </button>
    </div>

    <div id="message" class="message" role="status" aria-live="polite">
        Checking your access...
    </div>

    <div id="customerList"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
    "https://zyalhfwubhfsomaiomng.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oBiPfsgpmfTlZRGf5dsGQw_2SjntU7v";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =====================================
   PAGE STATE
===================================== */

const params = new URLSearchParams(window.location.search);
const businessId = params.get("business");

let currentUser = null;
let currentBusiness = null;
let loading = false;

/* =====================================
   SAFE HTML OUTPUT
===================================== */

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
        const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return replacements[char];
    });
}

function showMessage(message, isError = false) {
    const box = document.getElementById("message");

    box.textContent = message;
    box.className = isError
        ? "message error"
        : "message";
}

function formatDate(value) {
    if (!value) {
        return "Not provided";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleString("en-ZA", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function formatRand(value) {
    return "R" + Number(value || 0).toFixed(2);
}

/* =====================================
   BACK TO DASHBOARD
===================================== */

function goBack() {
    window.location.href = "owner.html";
}

/* =====================================
   CREATE WHATSAPP BUTTON
===================================== */

function createWhatsAppButton(customer) {
    const phone = String(customer.phone || "")
        .replace(/\D/g, "");

    /*
      South African international mobile format:
      27 followed by nine digits.

      Invalid or incomplete numbers do not receive
      a WhatsApp link.
    */

    if (!/^27\d{9}$/.test(phone)) {
        return `
            <p class="muted">
                WhatsApp contact unavailable.
                Please check this customer's phone number.
            </p>
        `;
    }

    const customerName = String(
        customer.name || "Customer"
    );

    const businessName = String(
        currentBusiness.name || "our business"
    );

    const message =
        "Hello " + customerName +
        "! This is " + businessName +
        ", contacting you through BookZA. " +
        "Thank you for choosing our business! " +
        "We appreciate your support. " +
        "If you have any questions or need assistance " +
        "with your order or appointment, please feel free " +
        "to message us. We look forward to serving you again!";

    const href =
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message);

    return `
        <a
            class="whatsapp-button"
            href="${href}"
            target="_blank"
            rel="noopener noreferrer"
        >
            Contact Customer on WhatsApp
        </a>
    `;
}

/* =====================================
   VERIFY OWNER ACCESS
===================================== */

async function initialisePage() {
    try {
        if (!businessId) {
            document.getElementById("businessName").textContent =
                "Business not selected";

            showMessage(
                "No business was selected. Return to the dashboard and open Customer History again.",
                true
            );

            return;
        }

        showMessage("Checking your access...");

        const {
            data: sessionData,
            error: sessionError
        } = await db.auth.getSession();

        if (sessionError) {
            throw sessionError;
        }

        currentUser = sessionData.session?.user || null;

        if (!currentUser) {
            showMessage(
                "You must log in to view customer history. Return to the owner dashboard and log in first.",
                true
            );

            return;
        }

        /*
          A URL parameter does not grant access.
          The selected business must belong to the
          currently authenticated user.
        */

        const {
            data: business,
            error: businessError
        } = await db
            .from("businesses")
            .select("id, name, owner_id")
            .eq("id", businessId)
            .eq("owner_id", currentUser.id)
            .maybeSingle();

        if (businessError) {
            throw businessError;
        }

        if (!business || business.owner_id !== currentUser.id) {
            document.getElementById("businessName").textContent =
                "Access denied";

            showMessage(
                "You do not have permission to view customer history for this business.",
                true
            );

            return;
        }

        currentBusiness = business;

        document.getElementById("businessName").textContent =
            business.name;

        await loadCustomerHistory();

    } catch (error) {
        console.error("Customer history access error:", error);

        showMessage(
            "We could not verify your access. " +
            (error?.message || "Please check your connection and try again."),
            true
        );
    }
}

/* =====================================
   LOAD CUSTOMER HISTORY
===================================== */

async function loadCustomerHistory() {
    if (loading) {
        return;
    }

    if (!currentUser || !currentBusiness) {
        showMessage(
            "Your business access has not been verified. " +
            "Please return to the owner dashboard and open Customer History again.",
            true
        );

        return;
    }

    loading = true;

    const refreshButton =
        document.getElementById("refreshButton");

    const customerList =
        document.getElementById("customerList");

    refreshButton.disabled = true;
    refreshButton.textContent = "Loading...";
    customerList.replaceChildren();

    showMessage("Loading customer history...");

    try {
        /*
          Fetch orders for the verified business.
          Supabase Row Level Security must also restrict
          which records the authenticated owner can read.
        */

        const {
            data: orders,
            error: ordersError
        } = await db
            .from("bookza_orders")
            .select(
                "id, business_id, customer_id, customer_name, customer_phone, order_type, booking_date, booking_time, total_amount, status, created_at"
            )
            .eq("business_id", currentBusiness.id)
            .order("created_at", { ascending: false });

        if (ordersError) {
            throw ordersError;
        }

        if (!orders || orders.length === 0) {
            showMessage(
                "No customer orders have been found for this business yet."
            );

            return;
        }

        /*
          Fetch item snapshots belonging to these orders.
        */

        const orderIds = orders.map(order => order.id);

        const {
            data: items,
            error: itemsError
        } = await db
            .from("bookza_order_items")
            .select(
                "order_id, item_name, quantity, unit_price, subtotal"
            )
            .in("order_id", orderIds);

        if (itemsError) {
            throw itemsError;
        }

        const itemsByOrder = {};

        (items || []).forEach(item => {
            if (!itemsByOrder[item.order_id]) {
                itemsByOrder[item.order_id] = [];
            }

            itemsByOrder[item.order_id].push(item);
        });

        /*
          Group orders by customer ID.
          Older orders without a customer ID fall back
          to their phone number.
        */

        const customers = new Map();

        orders.forEach(order => {
            const phone = String(
                order.customer_phone || ""
            ).trim();

            const key = order.customer_id
                ? "id:" + order.customer_id
                : phone
                    ? "phone:" + phone
                    : "order:" + order.id;

            if (!customers.has(key)) {
                customers.set(key, {
                    name: order.customer_name || "Customer",
                    phone: phone || "",
                    orders: []
                });
            }

            const customer = customers.get(key);

            if (
                (!customer.name || customer.name === "Customer") &&
                order.customer_name
            ) {
                customer.name = order.customer_name;
            }

            if (!customer.phone && phone) {
                customer.phone = phone;
            }

            customer.orders.push(order);
        });

        customerList.replaceChildren();

        for (const customer of customers.values()) {
            const card = document.createElement("section");
            card.className = "card";

            const totalSpent = customer.orders.reduce(
                (sum, order) =>
                    sum + Number(order.total_amount || 0),
                0
            );

            /*
              Orders are sorted newest first by the database,
              so the first order is the most recent one.
            */

            const firstOrder = customer.orders[0];

            let html = `
                <h2 class="customer-name">
                    ${escapeHtml(customer.name)}
                </h2>

                <div class="customer-phone">
                    Phone: ${escapeHtml(customer.phone || "Not provided")}
                </div>

                ${createWhatsAppButton(customer)}

                <div class="summary">
                    <strong>Total orders:</strong>
                    ${customer.orders.length}<br>

                    <strong>Total order value:</strong>
                    ${escapeHtml(formatRand(totalSpent))}<br>

                    <strong>Most recent order:</strong>
                    ${escapeHtml(formatDate(firstOrder.created_at))}
                </div>

                <h3>Previous Orders</h3>
            `;

            customer.orders.forEach(order => {
                const orderItems =
                    itemsByOrder[order.id] || [];

                let itemsHtml = "";

                if (orderItems.length) {
                    itemsHtml = orderItems.map(item => `
                        <p>
                            ${escapeHtml(item.item_name)}
                            × ${escapeHtml(item.quantity)}
                            — ${escapeHtml(formatRand(item.subtotal))}
                        </p>
                    `).join("");
                } else {
                    itemsHtml = `
                        <p class="muted">
                            Item details are unavailable.
                        </p>
                    `;
                }

                const requestedDate =
                    order.booking_date || "Not provided";

                const requestedTime =
                    order.booking_time || "Not provided";

                html += `
                    <div class="order">
                        <h3>
                            Order ${escapeHtml(order.id)}
                        </h3>

                        <p>
                            <strong>Order type:</strong>
                            ${escapeHtml(order.order_type)}
                        </p>

                        <p>
                            <strong>Placed:</strong>
                            ${escapeHtml(formatDate(order.created_at))}
                        </p>

                        <p>
                            <strong>Requested date:</strong>
                            ${escapeHtml(requestedDate)}
                        </p>

                        <p>
                            <strong>Requested time:</strong>
                            ${escapeHtml(requestedTime)}
                        </p>

                        ${itemsHtml}

                        <p>
                            <strong>Total:</strong>
                            ${escapeHtml(formatRand(order.total_amount))}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            <span class="status">
                                ${escapeHtml(order.status)}
                            </span>
                        </p>
                    </div>
                `;
            });

            card.innerHTML = html;
            customerList.appendChild(card);
        }

        showMessage(
            "Loaded " + customers.size +
            " customer record(s) and " +
            orders.length + " order(s) for " +
            currentBusiness.name + "."
        );

    } catch (error) {
        console.error("Customer history loading error:", error);

        showMessage(
            "Customer history could not be loaded. " +
            (error?.message ||
            "Check your database permissions and connection."),
            true
        );

    } finally {
        loading = false;
        refreshButton.disabled = false;
        refreshButton.textContent =
            "Refresh Customer History";
    }
}

/* =====================================
   START PAGE
===================================== */

initialisePage();
</script>

</body>
</html>
