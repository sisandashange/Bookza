<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookZA - Salons & Shisa-Nyama in Durban</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f8fafc}
.header{background:#0f172a;color:white;padding:20px;text-align:center}
.filters{display:flex;gap:10px;padding:15px;overflow:auto}
.filter{padding:10px 18px;border-radius:20px;border:1px solid #ddd;background:white;white-space:nowrap;cursor:pointer}
.filter.active{background:#0f172a;color:white}
.search{margin:0 15px;padding:14px;width:calc(100% - 30px);border-radius:10px;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:#e2e8f0}
.badge.food{background:#fef3c7}.badge.salon{background:#dbeafe}
</style></head><body>
<div class="header"><h1 style="margin:0">BookZA</h1><p>Book salons & order shisa-nyama in Umlazi</p></div>
<input id="search" class="search" placeholder="Search salon or shisa-nyama..." oninput="render()">
<div class="filters">
<div class="filter active" onclick="setFilter('all',this)">All</div>
<div class="filter" onclick="setFilter('salon',this)">💈 Salons & Barbers</div>
<div class="filter" onclick="setFilter('shisanyama',this)">🔥 Shisa-Nyama</div>
</div>
<div id="grid" class="grid">Loading...</div>
<script>
const supa=supabase.createClient("https://zyalhfwubhfsomaiomng.supabase.co","sb_publishable_oBiPfsgpmfTlZRGf5dsGQw_2SjntU7v");
let allBiz=[],curFilter='all';
async function load(){const{data}=await supa.from('businesses').select('*').eq('is_active',true); allBiz=data||[]; render();}
function setFilter(f,el){curFilter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function render(){const q=document.getElementById('search').value.toLowerCase();
const filtered=allBiz.filter(b=>{const matchType=curFilter==='all'||b.type===curFilter;const matchSearch=b.name.toLowerCase().includes(q);return matchType&&matchSearch;});
document.getElementById('grid').innerHTML=filtered.map(b=>`<div class="card" onclick="location.href='b.html?biz=${b.slug}'"><img src="${b.image||'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=500'}"><div class="card-body"><span class="badge ${b.type}">${b.type==='shisanyama'?'🔥 SHISA-NYAMA':'💈 SALON'}</span><h3 style="margin:8px 0 2px">${b.name}</h3><p style="margin:0;color:#64748b;font-size:13px">📍 ${b.location}</p></div></div>`).join('')||'<p style="padding:20px">No results</p>';}
load();
</script></body></html>
