<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookZA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:#f8fafc}
.top{height:220px;background:#000;position:relative}.top img{width:100%;height:100%;object-fit:cover;opacity:.8}
.top h1{position:absolute;bottom:15px;left:15px;color:white;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.wrap{padding:12px;max-width:600px;margin:auto}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:2px solid #f1f5f9;border-radius:12px;margin:8px 0;cursor:pointer}
.item.sel{border-color:#0f172a;background:#f8fafc}
.qty{display:flex;align-items:center;gap:10px}.qty b{width:22px;height:32px;display:grid;place-items:center;background:#0f172a;color:white;border-radius:8px;cursor:pointer}
input,select{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0}
.btn{width:100%;padding:18px;background:#0f172a;color:white;border:none;border-radius:12px;font-weight:800;font-size:16px;margin-top:8px}
.total{font-size:20px;font-weight:800;text-align:right;margin:10px 0}
</style></head><body>
<div class="top"><img id="bizImg" src=""><h1 id="bizName">Loading...</h1></div>
<div class="wrap"><div id="app" style="display:none">
<div class="card"><p id="bizMeta" style="margin:0;color:#64748b"></p></div>
<div class="card"><h3 id="listTitle">Choose</h3><div id="list"></div><div id="total" class="total"></div></div>
<div class="card"><h3>Your Details</h3>
<input id="cName" placeholder="Your Name"><input id="cPhone" placeholder="WhatsApp e.g 2771...">
<input id="cDate" type="date"><select id="cTime"></select>
<button class="btn" id="bookBtn" onclick="book()">Book Now</button>
</div></div></div>
<script>
const supa=supabase.createClient("https://zyalhfwubhfsomaiomng.supabase.co","sb_publishable_oBiPfsgpmfTlZRGf5dsGQw_2SjntU7v");
const slug=new URLSearchParams(location.search).get('biz'); let biz, cart={};
async function init(){
const {data}=await supa.from('businesses').select('*').eq('slug',slug).single(); biz=data;
document.getElementById('bizName').innerText=biz.name;
document.getElementById('bizImg').src=biz.image;
const isFood=biz.type==='shisanyama';
document.getElementById('bizMeta').innerText=(isFood?'🔥 Pre-order & skip queue':'💈 Online booking 24/7')+' • '+biz.location;
document.getElementById('listTitle').innerText=isFood?'Menu':'Services';
document.getElementById('cTime').innerHTML=isFood?'<option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option><option>21:00</option>':'<option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option>';
document.getElementById('bookBtn').innerText=isFood?'Order via WhatsApp':'Confirm Booking via WhatsApp';
const {data:services}=await supa.from('services').select('*').eq('business_id',biz.id);
const list=document.getElementById('list'); services.forEach(s=>{
cart[s.id]={s, qty:0}; const div=document.createElement('div'); div.className='item';
if(isFood){div.innerHTML=`<div><b>${s.name}</b><br><small>R${s.price}</small></div><div class="qty"><b onclick="chg('${s.id}',-1)">-</b><span id="q-${s.id}">0</span><b onclick="chg('${s.id}',1)">+</b></div>`;}
else{div.innerHTML=`<div><b>${s.name}</b><br><small>R${s.price} • ${s.duration}min</small></div><span>○</span>`; div.onclick=()=>{document.querySelectorAll('.item').forEach(x=>{x.classList.remove('sel'); x.lastChild.innerText='○'}); div.classList.add('sel'); div.lastChild.innerText='●'; cart={}; cart[s.id]={s,qty:1}; updateTotal();};}
list.appendChild(div);
}); document.getElementById('app').style.display='block';
}
function chg(id,d){cart[id].qty=Math.max(0,cart[id].qty+d); document.getElementById('q-'+id).innerText=cart[id].qty; updateTotal();}
function updateTotal(){let t=0; let has=false; Object.values(cart).forEach(v=>{if(v.qty>0){t+=v.s.price*v.qty; has=true;}}); document.getElementById('total').innerText=has?'Total: R'+t:'';}
async function book(){
const name=document.getElementById('cName').value; const phone=document.getElementById('cPhone').value;
const date=document.getElementById('cDate').value; const time=document.getElementById('cTime').value;
const items=Object.values(cart).filter(v=>v.qty>0); if(items.length==0||!name||!phone||!date){alert('Fill all + choose items'); return;}
const total=items.reduce((a,v)=>a+v.s.price*v.qty,0);
const orderText=items.map(v=>v.s.name+(v.qty>1?' x'+v.qty:'')).join(', ');
document.getElementById('bookBtn').innerText='Saving...';
await supa.from('bookings').insert({business_id:biz.id,customer_name:name,customer_phone:phone,service_id:items[0].s.id,date,time});
const msg=`*NEW ${biz.type==='shisanyama'?'ORDER':'BOOKING'}*%0A${biz.name}%0A%0AName: ${name}%0APhone: ${phone}%0AOrder: ${orderText}%0ATotal: R${total}%0ADate: ${date} ${time}%0A%0Avia BookZA`;
let cleanNum = String(biz.whatsapp).replace(/\D/g,''); if(cleanNum.startsWith('0')) cleanNum = '27' + cleanNum.substring(1); location.href='https://wa.me/'+cleanNum+'?text='+msg;
}init();
</script></body></html>
